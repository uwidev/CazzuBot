[project]
name = "cazzubot"
version = "2.0.0"
description = "Discord bot for Club Cirno — v2 rewrite: plugin-based, SQLite, single guild."
readme = "README.md"
requires-python = ">=3.10.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "discord.py>=2.7.1",
    "jsonschema>=4.21.1",
    "parsedatetime>=2.6",
    "pendulum>=2.1.2",
    "python-dotenv>=0.9.9",
]

[dependency-groups]
dev = [
    "basedpyright>=1.20.0",
    "pre-commit>=3.7.0",
    "ruff>=0.3.5",
]

[tool.ruff]
exclude = [
    ".venv",
    "board",
    "download",
    "emojis",
    "log",
    "data",
]
line-length = 75
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.basedpyright]
pythonVersion = "3.10"
pythonPlatform = "Linux"
allowedUntypedLibraries = []
