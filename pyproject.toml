[project]
name = "cazzubot"
version = "2.0.0"
description = "Discord bot for Club Cirno — v2 rewrite: plugin-based, SQLite, single guild."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20.0",
    "hikari>=2.5.0",
    "hikari-lightbulb>=3.2.5",
    "jsonschema>=4.21.1",
    "parsedatetime>=2.6",
    "pendulum>=2.1.2",
    "python-dotenv>=0.9.9",
    "typing_extensions>=4.3",
]

[dependency-groups]
# CLI tooling (roles/channels/snapshot) still runs on discord.py until the
# follow-up CLI port to hikari REST; the bot itself no longer depends on it.
cli = [
    "discord.py>=2.7.1",
]
dev = [
    "basedpyright>=1.20.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.1,<0.17",
]
migration = [
    "asyncpg>=0.29.0",
]

[project.scripts]
cazzubot-cli = "cazzubot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cazzubot", "plugins"]

[tool.uv]
# cli is a default group until the CLI port to hikari REST: the tooling
# (cazzubot-cli) still imports discord.py and must keep working on plain
# `uv sync`. Drop it from default-groups when the CLI is ported.
default-groups = ["dev", "cli"]

[tool.ruff]
exclude = [
    ".venv",
    "board",
    "download",
    "emojis",
    "log",
    "data",
]
line-length = 75
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.basedpyright]
pythonVersion = "3.14"
pythonPlatform = "Linux"
# Match the editor's recommended mode so the CLI and LSP agree, then tune the
# rules that don't fit this codebase below.
typeCheckingMode = "recommended"

# Libraries without type info (no py.typed): their symbols become Any instead
# of Unknown so the reportUnknown* rules stay quiet.
allowedUntypedLibraries = ["parsedatetime", "asyncpg"]

# -- rule overrides -------------------------------------------------------
# await db.execute(...) / ctx.send(...) and ignoring the result is the
# discord.py idiom; "_ = await ..." everywhere would hurt readability.
reportUnusedCallResult = "none"
# TYPE_CHECKING guards (cazzubot core referencing CazzuBot) and plugin
# packages importing their own submodules are deliberate and safe; the rule
# can't distinguish them from accidental cycles. See docs/ARCHITECTURE.md.
reportImportCycles = "none"
# Library-author strictness: instance attrs set in __init__ are already
# inferred, and plugin classes are configuration singletons.
reportUnannotatedClassAttribute = "none"
# The JSON/sqlite layer intentionally uses Any (heterogeneous rows).
reportExplicitAny = "none"
# Any is inherent to this codebase's dynamic layer: aiosqlite rows,
# discord.py's API surface, and the JSON template store. reportAny would
# flag every row value / Any annotation, drowning out real findings; the
# reportUnknown* rules (missing annotations) stay enabled.
reportAny = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # discord.py 2.7.1 still uses asyncio.iscoroutinefunction, deprecated in
    # Python 3.14 and removed in 3.16 — third-party noise, not ours to fix.
    "ignore:.*iscoroutinefunction.*:DeprecationWarning",
    # parsedatetime 1.x's flag-style API is deprecated ahead of 2.0 (its own
    # pdt20DeprecationWarning class) — the natural-language layer we call.
    "ignore:.*Flag style will be deprecated.*",
]
